<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">styling companion</p>
      <h1 class="brand">yom</h1>
      <p class="tag" id="tagline">calendar, closet, and sizes on every shop.</p>
      <div id="auth-out">
        <button type="button" id="create-yom">create yom</button>
        <button type="button" id="login-yom" class="secondary">log in</button>
      </div>
      <div id="auth-in" class="hidden">
        <p class="who" id="who"></p>
        <button type="button" id="open-scan" class="secondary">open yom</button>
        <button type="button" id="logout-yom" class="secondary">log out</button>
      </div>
      <p class="hint">shop with the buddy on any clothing site.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
