<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">shopping companion</p>
      <h1 class="brand">yom</h1>
      <p class="tag">
        yom thinks for everyone through youryom.com. no one else pastes a key.
      </p>
      <button id="launch" type="button">open Reformation</button>
      <button id="launch-green" type="button" class="secondary">open green dresses</button>
      <button id="launch-tab" type="button" class="secondary">use this tab</button>

      <section class="key-block">
        <label for="api-key">optional override</label>
        <p class="key-status" id="key-status">shared brain is on. a personal key is only if you want to test against your own account.</p>
        <div class="provider" id="provider">
          <button type="button" data-provider="anthropic" class="on">Anthropic</button>
          <button type="button" data-provider="openai">OpenAI</button>
        </div>
        <input
          id="api-key"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="personal key — optional"
        />
        <div class="key-row">
          <button id="save-key" type="button" class="secondary">save override</button>
          <button id="clear-key" type="button" class="ghost">clear</button>
        </div>
      </section>
      <p class="hint">the shared key lives on the server, not in the extension.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
