<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">shopping companion</p>
      <h1 class="brand">yom</h1>
      <p class="tag">tap yom, then hover over a piece. it knows your style better than you do.</p>

      <div id="auth-out">
        <form id="login-form">
          <input id="email" type="email" autocomplete="username" placeholder="email" required />
          <input id="password" type="password" autocomplete="current-password" placeholder="password" required />
          <button type="submit" id="login-btn">log in</button>
        </form>
        <button type="button" class="secondary" id="signup-btn">create account</button>
        <p class="err" id="auth-err" hidden></p>
        <p class="hint" id="auth-hint">beta list only. you can still shop as the demo.</p>
      </div>

      <div id="auth-in" hidden>
        <p class="who" id="who"></p>
        <button type="button" class="secondary" id="logout">log out</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
